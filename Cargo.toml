[package]
name = "tgwszapret"
version = "0.1.0"
edition = "2024"

[dependencies]
eframe = "0.31"
rfd = "0.15"
ureq = "2.10"
zip = "2.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tray-icon = "0.19"

[build-dependencies]
winres = "0.1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
